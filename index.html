<!doctype html>
<html lang="de">
<head>

<title>Satzbuch</title>
<style>
:root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}

<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: eine Spalte (max 560px), fixe Tab-Leiste unten, Karten nur dort, wo ein Objekt gemeint ist (Übung, Training, Mahlzeit). */
:root{
  --bg:#EDEFF3; --surface:#FFFFFF; --surface2:#E4E8EE; --line:#D3D9E2;
  --fg:#12151A; --muted:#586170; --accent:#E4560F; --accent-ink:#BF420A; --accent-fg:#FFFFFF;
  --good:#17804A; --warn:#A8690F; --bad:#C2332F;
  --font-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1116; --surface:#171B22; --surface2:#212630; --line:#2A303B;
  --fg:#ECEFF4; --muted:#97A1B1; --accent:#FF7A33; --accent-ink:#FF8F52; --accent-fg:#1A0E05;
  --good:#4CC38A; --warn:#E5B04A; --bad:#F07178; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1116; --surface:#171B22; --surface2:#212630; --line:#2A303B;
  --fg:#ECEFF4; --muted:#97A1B1; --accent:#FF7A33; --accent-ink:#FF8F52; --accent-fg:#1A0E05;
  --good:#4CC38A; --warn:#E5B04A; --bad:#F07178; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 96px;font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--font-display);font-weight:600;letter-spacing:.01em;text-wrap:balance}
h2{font-size:30px;line-height:1.1}
h3{font-size:20px}
.top{display:flex;align-items:center;justify-content:space-between;padding-block:14px 6px}
.brand{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:.14em;text-transform:uppercase}
.brand b{color:var(--accent-ink)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.cloud i{background:var(--good)} .sync.error i{background:var(--bad)} .sync.pending i{background:var(--warn)}
main{display:flex;flex-direction:column;gap:18px;padding-block:6px 12px}
section{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-h small,.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface2);border-radius:var(--r);padding:10px 12px;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 0;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 14px;min-height:44px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.block{width:100%}
.btn:active{transform:translateY(1px)}
.link{background:none;border:0;padding:4px 0;color:var(--accent-ink);font-weight:500;min-height:32px}
.tpl{display:flex;gap:10px;align-items:stretch}
.tpl .meta{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.tpl .meta b{font-family:var(--font-display);font-size:22px;font-weight:600;line-height:1.1}
.tpl .meta span{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tpl .acts{display:flex;flex-direction:column;gap:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--font-display);font-size:28px;font-weight:600;line-height:1.05}
.stat span{font-size:12px;color:var(--muted)}
.stat .d{font-size:12px;font-weight:600}
.up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--muted)}
/* aktives Training */
.actbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
.actbar input.name{background:transparent;border:0;font-family:var(--font-display);font-size:26px;font-weight:600;padding:0;width:100%}
.actstats{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.actstats b{color:var(--fg);font-weight:600}
.ex-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:8px}
.ex-h b{font-size:16px;font-weight:600;display:block}
.ex-h span{font-size:12px;color:var(--muted)}
.setgrid,.setrow{display:grid;grid-template-columns:26px minmax(0,1fr) 78px 66px 44px;gap:8px;align-items:center}
.setgrid{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-bottom:4px}
.setgrid span:nth-child(n+3),.setgrid span:last-child{text-align:center}
.setrow{padding-block:3px}
.setrow .sn{font-weight:600;color:var(--muted);text-align:center}
.setrow .prev{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.in{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 8px;text-align:center;font-weight:600;font-size:16px}
.in.l{text-align:left;font-weight:400}
.setrow.done .in{background:color-mix(in srgb,var(--good) 14%,var(--bg));border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.chk{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center;color:var(--muted)}
.setrow.done .chk{background:var(--good);border-color:var(--good);color:#fff}
.ex-f{display:flex;gap:8px;margin-top:8px}
/* Rest-Timer */
.rest{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:20;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.rest>div{max-width:560px;margin:0 auto;background:var(--fg);color:var(--bg);border-radius:var(--r);padding:8px 8px 8px 14px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px rgb(0 0 0/.25)}
.rest .t{font-family:var(--font-display);font-size:28px;font-weight:600;min-width:64px}
.rest .lbl{font-size:12px;opacity:.75;flex:1}
.rest button{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);color:var(--bg);border-radius:8px;min-height:36px;padding:0 10px;font-weight:600}
.rest .prog{position:absolute;left:0;bottom:0;height:3px;background:var(--accent)}
.rest>div{position:relative;overflow:hidden}
/* Listen */
.wk{padding:0;overflow:hidden}
.wk-head{width:100%;background:none;border:0;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;text-align:left}
.wk-head b{font-family:var(--font-display);font-size:21px;font-weight:600;display:block;line-height:1.1}
.wk-head span{font-size:13px;color:var(--muted)}
.wk-head .r{text-align:right;flex:none}
.wk-body{border-top:1px solid var(--line);padding:10px 14px 14px;display:flex;flex-direction:column;gap:8px}
.wk-ex b{font-weight:600;font-size:14px}
.wk-ex div{font-size:13px;color:var(--muted)}
.seg{display:flex;background:var(--surface2);border-radius:var(--r);padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;min-height:38px;padding:0 8px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0/.15)}
.seg.num button{min-height:44px}
.sel{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 10px}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:6px 8px 6px 0}
td{padding:8px 8px 8px 0;border-top:1px solid var(--line);vertical-align:top}
td small{display:block;color:var(--muted)}
th.n,td.n{text-align:right;padding-right:0}
/* Charts */
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:10px;font-family:var(--font-body)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);opacity:.13}
.chart .dot{fill:var(--bg);stroke:var(--accent);stroke-width:1.8}
.chart .dot.end{fill:var(--accent)}
.chart .bar{fill:var(--accent)}
.chart .bar.dim{fill:var(--surface2)}
.chart .goal{stroke:var(--muted);stroke-dasharray:4 3;stroke-width:1}
.chart .val{fill:var(--fg);font-size:10px;font-weight:600;font-family:var(--font-body)}
.empty{color:var(--muted);font-size:14px;margin:0}
/* Balken-Zeilen */
.hbar{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;font-size:13px}
.hbar .tr{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.hbar .fi{height:100%;background:var(--accent);border-radius:4px}
.hbar .fi.good{background:var(--good)} .hbar .fi.warn{background:var(--warn)} .hbar .fi.bad{background:var(--bad)}
.hbar b{font-weight:600;min-width:56px;text-align:right}
.hbar>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);letter-spacing:.02em}
.pill.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.score{display:flex;align-items:center;gap:14px}
.score .big{font-family:var(--font-display);font-size:64px;font-weight:700;line-height:.9}
.score p{margin:0}
.ring{width:132px;height:132px;flex:none}
.ring .bg{fill:none;stroke:var(--surface2);stroke-width:10}
.ring .fg{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round}
.ring .fg.over{stroke:var(--bad)}
.ring text{fill:var(--fg);font-family:var(--font-display);text-anchor:middle}
.food-top{display:flex;gap:14px;align-items:center}
.macros{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.mac .h{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
.mac .tr{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.mac .fi{height:100%;border-radius:4px}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav b{font-family:var(--font-display);font-size:22px;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;min-height:40px;font-size:13px;font-weight:500;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meal{display:flex;justify-content:space-between;gap:10px;padding-block:10px;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0}
.meal b{font-weight:500}
.meal small{display:block;color:var(--muted)}
.meal .r{text-align:right;flex:none}
.x{background:none;border:0;color:var(--muted);min-width:36px;min-height:36px;font-size:20px;line-height:1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12px;color:var(--muted)}
.field .in{text-align:left;font-weight:400}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
/* Sheets */
.scrim{position:fixed;inset:0;background:rgb(8 10 14/.55);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88%;overflow-y:auto;background:var(--bg);border-radius:16px 16px 0 0;
  padding:16px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:12px;margin:0 auto;max-width:560px;box-shadow:0 -8px 30px rgb(0 0 0/.3)}
.sheet.p2{z-index:51}.scrim.p2{z-index:50}
.sheet-h{display:flex;justify-content:space-between;align-items:center}
.pgroup{display:flex;flex-direction:column}
.pgroup .label{padding-block:10px 4px}
.pitem{display:flex;justify-content:space-between;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 2px;min-height:44px}
.pitem small{color:var(--muted)}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 56px 56px 36px;gap:6px;align-items:center}
.trow .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .in{padding:0 4px}
/* Navigation */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
nav>div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:8px;color:var(--muted);text-decoration:none;font-size:11px;font-weight:500;min-height:46px}
nav a[aria-current="page"]{color:var(--accent-ink)}
nav svg{width:22px;height:22px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13px;font-weight:500;max-width:90%;text-align:center}
.pr{display:flex;gap:8px;align-items:center;font-size:14px}
@media (max-width:380px){.setgrid,.setrow{grid-template-columns:22px minmax(0,1fr) 68px 58px 42px;gap:6px}.stats{gap:6px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <div class="top"><div class="brand">Satz<b>buch</b></div><div class="sync" id="sync"><i></i><span>Lädt…</span></div></div>

  <main id="main"><p class="empty">Lade deine Daten…</p></main>
</div>

<div id="picker"></div>

<script>
(function(){
'use strict';
/* ---------- Helfer ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>{d=d instanceof Date?d:new Date(d);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const parseDay=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const addDays=(s,n)=>{const d=parseDay(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(n)?n:0};
const fmt=(n,d=0)=>Number(n).toLocaleString('de-DE',{maximumFractionDigits:d,minimumFractionDigits:0});
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
const MON=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const dayLabel=s=>{const d=parseDay(s);return WD[d.getDay()]+', '+d.getDate()+'. '+MON[d.getMonth()]};
const shortDay=s=>{const d=parseDay(s);return d.getDate()+'.'+(d.getMonth()+1)+'.'};
const weekStart=s=>{const d=parseDay(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)};
const e1=(kg,r)=>r<=0?0:(r===1?kg:kg*(1+r/30));
const mmss=sec=>{sec=Math.max(0,Math.round(sec));return Math.floor(sec/60)+':'+pad(sec%60)};
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- Stammdaten ---------- */
const MUSCLES=['Brust','Rücken','Schultern','Bizeps','Trizeps','Quadrizeps','Beinbeuger','Gesäß','Waden','Bauch'];
const LIB=[
['Bankdrücken','Brust'],['Schrägbankdrücken Kurzhantel','Brust'],['Fliegende Kabelzug','Brust'],['Dips','Brust'],
['Kreuzheben','Rücken'],['Klimmzüge','Rücken'],['Langhantelrudern','Rücken'],['Latziehen','Rücken'],['Rudern am Kabel','Rücken'],
['Schulterdrücken','Schultern'],['Seitheben','Schultern'],['Face Pulls','Schultern'],
['Langhantelcurls','Bizeps'],['Hammercurls','Bizeps'],
['Trizepsdrücken Kabel','Trizeps'],['French Press','Trizeps'],
['Kniebeugen','Quadrizeps'],['Beinpresse','Quadrizeps'],['Ausfallschritte','Quadrizeps'],['Beinstrecker','Quadrizeps'],
['Rumänisches Kreuzheben','Beinbeuger'],['Beinbeuger liegend','Beinbeuger'],
['Hip Thrust','Gesäß'],['Wadenheben stehend','Waden'],['Plank','Bauch'],['Hängendes Beinheben','Bauch']];
const MEALTYPES=['Frühstück','Mittagessen','Abendessen','Snack'];
const LS='satzbuch.v1';

function defaultState(){
  const exercises=LIB.map((x,i)=>({id:'e'+i,name:x[0],muscle:x[1]}));
  const id=n=>exercises.find(e=>e.name===n).id;
  const T=(n,list)=>({id:'t_'+n.toLowerCase(),name:n,exercises:list.map(l=>({exId:id(l[0]),sets:l[1],reps:l[2]}))});
  return{
    meta:{seeded:false,updated:0},
    exercises,
    templates:[
      T('Push',[['Bankdrücken',4,8],['Schulterdrücken',3,8],['Schrägbankdrücken Kurzhantel',3,10],['Seitheben',3,12],['Trizepsdrücken Kabel',3,12]]),
      T('Pull',[['Langhantelrudern',4,8],['Latziehen',3,10],['Rudern am Kabel',3,10],['Face Pulls',3,15],['Langhantelcurls',3,10]]),
      T('Beine',[['Kniebeugen',4,6],['Rumänisches Kreuzheben',3,8],['Beinpresse',3,10],['Beinbeuger liegend',3,12],['Wadenheben stehend',4,12]])],
    goals:{kcal:2600,p:160,c:300,f:75},
    active:null,rest:90,
    workouts:[],recovery:[],meals:[]
  };
}
function seedDemo(s){
  const r=rng(42);
  const base={'Bankdrücken':70,'Schulterdrücken':40,'Schrägbankdrücken Kurzhantel':26,'Seitheben':10,'Trizepsdrücken Kabel':30,'Langhantelrudern':60,'Latziehen':55,'Rudern am Kabel':50,'Face Pulls':25,'Langhantelcurls':30,'Kniebeugen':80,'Rumänisches Kreuzheben':90,'Beinpresse':160,'Beinbeuger liegend':40,'Wadenheben stehend':70};
  const plan={1:'t_push',3:'t_pull',5:'t_beine'};
  const now=new Date();
  for(let off=56;off>=1;off--){
    const d=new Date(now);d.setDate(d.getDate()-off);
    const t=s.templates.find(x=>x.id===plan[d.getDay()]);
    if(!t||r()<0.1)continue;
    const w=Math.floor((56-off)/7);
    d.setHours(17,30+Math.floor(r()*30),0,0);
    const start=d.getTime();
    const ex=t.exercises.map(te=>{
      const name=s.exercises.find(e=>e.id===te.exId).name;
      const b=base[name]||20, step=b>=40?2.5:(b>=20?1:.5);
      const kg=Math.round((b+w*b*0.012)/step)*step;
      const sets=[];
      for(let i=0;i<te.sets;i++){sets.push({kg:kg,reps:Math.max(4,te.reps-(i>1&&r()<.5?1:0)-(i>2&&r()<.4?1:0)),demo:1})}
      return{exId:te.exId,sets:sets.map(x=>({kg:x.kg,reps:x.reps}))};
    });
    s.workouts.push({id:uid(),day:ymd(d),start:start,end:start+(52+Math.floor(r()*22))*60000,name:t.name,templateId:t.id,exercises:ex,demo:1});
  }
  for(let off=13;off>=1;off--){
    s.recovery.push({day:addDays(today(),-off),sleep:Math.round((6+r()*2.5)*2)/2,quality:2+Math.floor(r()*4),sore:1+Math.floor(r()*4),energy:2+Math.floor(r()*4),hr:52+Math.floor(r()*8),kg:Math.round((82.4-(13-off)*0.04+r()*.4)*10)/10,demo:1});
  }
  const M=[['Frühstück','Haferflocken mit Skyr & Beeren',520,38,68,10],['Mittagessen','Hähnchen, Reis, Brokkoli',680,52,82,12],['Snack','Proteinshake + Banane',310,30,38,4],['Abendessen','Lachs, Kartoffeln, Salat',720,45,58,32]];
  for(let off=6;off>=0;off--){
    M.forEach((m,i)=>{if(off===0&&i>1)return;const j=.92+r()*.16;
      s.meals.push({id:uid(),day:addDays(today(),-off),type:m[0],name:m[1],kcal:Math.round(m[2]*j),p:Math.round(m[3]*j),c:Math.round(m[4]*j),f:Math.round(m[5]*j),demo:1})});
  }
  s.meta.seeded=true;
  s.workouts.sort((a,b)=>a.start-b.start);
}

let state=null, dbc=null, lastDocs={}, flushing=false, again=false, saveTimer=null, syncMode='local';

function readLocal(){try{const t=localStorage.getItem(LS);return t?JSON.parse(t):null}catch(e){return null}}
function shard(s){
  const d={core:{meta:s.meta,exercises:s.exercises,templates:s.templates,goals:s.goals,active:s.active,rest:s.rest}};
  const put=(prefix,arr,keyOf)=>{arr.forEach(it=>{const k=prefix+'_'+keyOf(it);(d[k]=d[k]||{items:[]}).items.push(it)})};
  put('w',s.workouts,w=>w.day.slice(0,7));
  put('m',s.meals,m=>m.day.slice(0,7));
  put('r',s.recovery,r=>r.day.slice(0,4));
  return d;
}
function assemble(docs){
  const s=defaultState(),c=docs.core;
  if(c){['meta','exercises','templates','goals','active','rest'].forEach(k=>{if(c[k]!==undefined)s[k]=c[k]})}
  Object.keys(docs).forEach(id=>{
    const items=docs[id]&&docs[id].items||[];
    if(id.startsWith('w_'))s.workouts.push(...items);
    else if(id.startsWith('m_'))s.meals.push(...items);
    else if(id.startsWith('r_'))s.recovery.push(...items);
  });
  s.workouts.sort((a,b)=>a.start-b.start);
  return s;
}
function setSync(m){
  syncMode=m;const el=$('#sync');if(!el)return;
  const t={cloud:'Gespeichert',local:'Nur auf diesem Gerät',pending:'Speichert…',error:'Speichern fehlgeschlagen'}[m]||'';
  el.className='sync '+m;el.querySelector('span').textContent=t;
}
function save(){
  state.meta.updated=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}
  if(!dbc){setSync('local');return}
  setSync('pending');clearTimeout(saveTimer);saveTimer=setTimeout(flush,1200);
}
async function flush(){
  if(!dbc)return;
  if(flushing){again=true;return}
  flushing=true;
  try{
    const docs=shard(state);
    for(const id of Object.keys(docs)){
      const str=JSON.stringify(docs[id]);
      if(lastDocs[id]===str)continue;
      await dbc.doc(id).set(docs[id]);lastDocs[id]=str;
    }
    for(const id of Object.keys(lastDocs)){
      if(!docs[id]){await dbc.doc(id).delete();delete lastDocs[id]}
    }
    setSync('cloud');
  }catch(e){setSync('error')}
  flushing=false;
  if(again){again=false;flush()}
}
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]);
async function loadAll(){
  const local=readLocal();
  let cloud=null;
  try{
    if(window.claude&&window.claude.use){
      const db=await withTimeout(window.claude.use('db'),10000);
      const user=await withTimeout(window.claude.use('user'),10000);
      const id=user&&await user.id();
      if(db&&id){
        const col=db.collection('data/users/'+id);
        const snap=await withTimeout(col.get(),10000);
        dbc=col;
        const docs={};snap.docs.forEach(d=>{docs[d.id]=d.data()});
        if(docs.core)cloud=assemble(docs);
      }
    }
  }catch(e){dbc=null}
  let pick=null;
  if(cloud&&local)pick=(local.meta&&local.meta.updated||0)>(cloud.meta.updated||0)?local:cloud;
  else pick=cloud||local;
  if(pick){state=Object.assign(defaultState(),pick);if(pick===cloud&&dbc){const sh=shard(state);Object.keys(sh).forEach(k=>lastDocs[k]=JSON.stringify(sh[k]))}}
  else{state=defaultState();seedDemo(state)}
  if(dbc){if(pick!==cloud||!pick){flush()}setSync(pick===cloud?'cloud':'pending')}else setSync('local');
  if(!pick||pick===local)save();
}

const exById=id=>state.exercises.find(e=>e.id===id)||{id:id,name:'Unbekannte Übung',muscle:''};
const setVol=s=>s.reduce((a,x)=>a+x.kg*x.reps,0);
const wkVol=w=>w.exercises.reduce((a,e)=>a+setVol(e.sets),0);
const wkSets=w=>w.exercises.reduce((a,e)=>a+e.sets.length,0);
const wkMin=w=>Math.max(1,Math.round((w.end-w.start)/60000));
const bestSet=sets=>sets.reduce((b,x)=>(!b||e1(x.kg,x.reps)>e1(b.kg,b.reps))?x:b,null);
function lastSets(exId,beforeStart){
  for(let i=state.workouts.length-1;i>=0;i--){
    const w=state.workouts[i];if(beforeStart&&w.start>=beforeStart)continue;
    const e=w.exercises.find(x=>x.exId===exId);if(e)return e.sets;
  }
  return null;
}
function sessionsFor(exId){
  return state.workouts.map(w=>{const e=w.exercises.find(x=>x.exId===exId);if(!e)return null;
    const b=bestSet(e.sets);return{w:w,t:w.start,top:Math.max(...e.sets.map(x=>x.kg)),e1:e1(b.kg,b.reps),vol:setVol(e.sets),best:b}}).filter(Boolean);
}
function exCounts(){const m={};state.workouts.forEach(w=>w.exercises.forEach(e=>{m[e.exId]=(m[e.exId]||0)+1}));return m}
function activeStats(){
  const a=state.active;let sets=0,vol=0;
  a.exercises.forEach(e=>e.sets.forEach(s=>{if(s.done){sets++;vol+=num(s.kg)*num(s.reps)}}));
  return{sets:sets,vol:vol};
}

/* ---------- Charts (SVG, eine Skala) ---------- */
function niceRange(min,max){
  if(max<=min){max=min+1;min=Math.max(0,min-1)}
  const raw=(max-min)/4,mag=Math.pow(10,Math.floor(Math.log10(raw))),n=raw/mag;
  const step=(n<=1?1:n<=2?2:n<=5?5:10)*mag;
  return{lo:Math.floor(min/step+1e-9)*step,hi:Math.ceil(max/step-1e-9)*step,step:step};
}
function lineChart(pts,o){
  o=o||{};const f=o.fmtV||(v=>fmt(v,1));
  if(pts.length<2)return'<p class="empty">Für einen Verlauf braucht es mindestens zwei Einträge.</p>';
  const W=340,H=o.h||180,L=40,R=14,T=14,B=26;
  const vs=pts.map(p=>p.v);let r=niceRange(Math.min(...vs),Math.max(...vs));
  const lo=r.lo,hi=r.hi,step=r.step,t0=pts[0].t,t1=pts[pts.length-1].t;
  const x=t=>L+(t1===t0?.5:(t-t0)/(t1-t0))*(W-L-R), y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  let g='';const n=Math.round((hi-lo)/step);
  for(let i=0;i<=n;i++){const v=lo+i*step;g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v).toFixed(1)+'" y2="'+y(v).toFixed(1)+'"/><text class="ax" x="'+(L-6)+'" y="'+(y(v)+3.5).toFixed(1)+'" text-anchor="end">'+f(v)+'</text>'}
  const d=pts.map((p,i)=>(i?'L':'M')+x(p.t).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  const area=d+' L'+x(t1).toFixed(1)+' '+y(lo).toFixed(1)+' L'+x(t0).toFixed(1)+' '+y(lo).toFixed(1)+' Z';
  const dots=pts.length<=30?pts.map((p,i)=>'<circle class="dot'+(i===pts.length-1?' end':'')+'" cx="'+x(p.t).toFixed(1)+'" cy="'+y(p.v).toFixed(1)+'" r="'+(i===pts.length-1?3.5:2.5)+'"/>').join(''):'<circle class="dot end" cx="'+x(t1).toFixed(1)+'" cy="'+y(pts[pts.length-1].v).toFixed(1)+'" r="3.5"/>';
  const dl=t=>{const d=new Date(t);return d.getDate()+'.'+(d.getMonth()+1)+'.'};
  return'<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label||'Verlauf')+'">'+g+'<path class="ar" d="'+area+'"/><path class="ln" d="'+d+'"/>'+dots+
    '<text class="ax" x="'+L+'" y="'+(H-8)+'">'+dl(t0)+'</text><text class="ax" x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end">'+dl(t1)+'</text></svg>';
}
function barChart(items,o){
  o=o||{};const f=o.fmtV||(v=>fmt(v));
  const W=340,H=o.h||160,L=40,R=10,T=16,B=24;
  const vals=items.map(i=>i.v);let mx=Math.max(o.goal||0,...vals,1);
  const r=niceRange(0,mx*1.08),lo=0,hi=r.hi,step=r.step;
  const y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B), bw=(W-L-R)/items.length, w=bw*.6;
  let g='';const n=Math.round(hi/step);
  for(let i=0;i<=n;i++){const v=i*step;g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v).toFixed(1)+'" y2="'+y(v).toFixed(1)+'"/><text class="ax" x="'+(L-6)+'" y="'+(y(v)+3.5).toFixed(1)+'" text-anchor="end">'+f(v)+'</text>'}
  let b='',skip=items.length>8?2:1;
  items.forEach((it,i)=>{
    const x=L+i*bw+(bw-w)/2,h=Math.max(0,y(0)-y(it.v));
    b+='<rect class="bar'+(it.dim?' dim':'')+'" x="'+x.toFixed(1)+'" y="'+(y(it.v)).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2"/>';
    if(i%skip===0)b+='<text class="ax" x="'+(x+w/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(it.label)+'</text>';
    if(items.length<=8&&it.v>0)b+='<text class="val" x="'+(x+w/2).toFixed(1)+'" y="'+(y(it.v)-4).toFixed(1)+'" text-anchor="middle">'+f(it.v)+'</text>';
  });
  const gl=o.goal?'<line class="goal" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(o.goal).toFixed(1)+'" y2="'+y(o.goal).toFixed(1)+'"/>':'';
  return'<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label||'Balkendiagramm')+'">'+g+b+gl+'</svg>';
}
function delta(a,b,unit,dec,invert){
  if(!b)return'<span class="flat">–</span>';
  const d=a-b,p=d/b*100;if(Math.abs(p)<0.05)return'<span class="flat">±0</span>';
  const good=invert?d<0:d>0;
  return'<span class="'+(good?'up':'down')+'">'+(d>0?'+':'−')+fmt(Math.abs(d),dec||0)+(unit||'')+' ('+(d>0?'+':'−')+fmt(Math.abs(p),1)+'%)</span>';
}

function vCompare(ws){
  if(ws.length<2)return'<p class="empty">Zum Vergleichen braucht es mindestens zwei Trainings.</p>';
  if(!ws.find(w=>w.id===ui.cmpA)){ui.cmpA=ws[0].id;const prevSame=ws.slice(1).find(w=>w.name===ws[0].name)||ws[1];ui.cmpB=prevSame.id}
  if(!ws.find(w=>w.id===ui.cmpB)||ui.cmpB===ui.cmpA)ui.cmpB=(ws.find(w=>w.id!==ui.cmpA)||ws[1]).id;
  const A=ws.find(w=>w.id===ui.cmpA),B=ws.find(w=>w.id===ui.cmpB);
  const opt=sel=>ws.map(w=>'<option value="'+esc(w.id)+'"'+(w.id===sel?' selected':'')+'>'+esc(dayLabel(w.day)+' · '+w.name)+'</option>').join('');
  let h='<div class="g2"><label class="field"><span>Training A</span><select class="sel" id="cmpA" data-act-change="cmpA">'+opt(A.id)+'</select></label><label class="field"><span>Training B</span><select class="sel" id="cmpB" data-act-change="cmpB">'+opt(B.id)+'</select></label></div>';
  const inten=w=>{const reps=w.exercises.reduce((a,e)=>a+e.sets.reduce((x,s)=>x+s.reps,0),0);return reps?wkVol(w)/reps:0};

  });
  return h+'</tbody></table></div><p class="small muted" style="margin:0">Δ 1RM vergleicht den geschätzten Maximalwert des besten Satzes (Epley), A gegenüber B.</p></section>';
}

const segBtns=(f,cur,n,labels)=>{let s='';for(let i=1;i<=n;i++)s+='<button data-act="rec-set" data-f="'+f+'" data-v="'+i+'" aria-pressed="'+(cur===i)+'">'+(labels&&labels[i-1]||i)+'</button>';return'<div class="seg num" role="group">'+s+'</div>'};
function readiness(r){
  const sc=clamp(r.sleep/8,0,1)*35+(r.quality-1)/4*15+(5-r.sore)/4*25+(r.energy-1)/4*25;
  return Math.round(sc);
}
function muscleRecovery(){
  const now=Date.now(),res={};
  state.workouts.forEach(w=>{
    const cnt={};w.exercises.forEach(e=>{const m=exById(e.exId).muscle;if(m)cnt[m]=(cnt[m]||0)+e.sets.length});
    Object.keys(cnt).forEach(m=>{if(!res[m]||w.end>res[m].end)res[m]={end:w.end,sets:cnt[m]}});
  });
  return MUSCLES.map(m=>{
    const r=res[m];if(!r)return{m:m,pct:null};
    const hrs=(now-r.end)/36e5,need=48+Math.min(48,Math.max(0,r.sets-6)*6);
    return{m:m,hrs:hrs,need:need,pct:clamp(hrs/need*100,0,100),sets:r.sets};
  }).sort((a,b)=>(a.pct==null?101:a.pct)-(b.pct==null?101:b.pct));
}

    mr.map(x=>x.pct==null?'<div class="hbar"><span>'+x.m+'</span><div class="tr"></div><b class="muted">–</b></div>':'<div class="hbar"><span>'+x.m+'</span><div class="tr"><div class="fi '+(x.pct>=100?'good':x.pct>=50?'warn':'bad')+'" style="width:'+x.pct+'%"></div></div><b>'+(x.pct>=100?'bereit':Math.round(x.pct)+'%')+'</b></div>').join('')+

  });
  if(q&&!exact)h+='<div class="card" style="display:flex;flex-direction:column;gap:8px;margin-top:10px"><b>„'+esc(ui.picker.q.trim())+'“ neu anlegen</b><select class="sel" id="newMuscle" aria-label="Muskelgruppe">'+MUSCLES.map(m=>'<option>'+m+'</option>').join('')+'</select><button class="btn primary" data-act="pick-create">Übung anlegen</button></div>';
  return h||'<p class="empty">Keine Treffer.</p>';
}
function pickerHtml(){
  if(!ui.picker)return'';
  return'<div class="scrim p2" data-act="close-picker"></div><section class="sheet p2" role="dialog" aria-modal="true"><div class="sheet-h"><h3>Übung wählen</h3><button class="x" data-act="close-picker" aria-label="Schließen">×</button></div><input class="in l" id="pq" type="search" placeholder="Suchen oder neue Übung eintippen" value="'+esc(ui.picker.q||'')+'" autocomplete="off"><div id="plist">'+pickerList()+'</div></section>';
}

/* ---------- Rendern ---------- */
function render(){
  if(!state){return}
  const views={train:vTrain,log:vLog,progress:vProgress,recovery:vRecovery,food:vFood};
  $('#main').innerHTML=views[ui.tab]();
  $('#nav').innerHTML=TABS.map(t=>'<a href="#'+t[0]+'"'+(ui.tab===t[0]?' aria-current="page"':'')+'>'+ico(t[0])+'<span>'+t[1]+'</span></a>').join('');
  const demo=state.workouts.some(w=>w.demo)||state.meals.some(m=>m.demo)||state.recovery.some(r=>r.demo);
  $('#banner').innerHTML=demo?'<div class="banner"><span>Beispieldaten aktiv. Sie zeigen dir, wie die Auswertungen aussehen.</span><button class="btn sm" data-act="demo-remove" data-confirm="1">Entfernen</button></div>':'';
  renderSheets();
}
function renderSheets(){
  $('#sheet').innerHTML=sheetHtml();$('#picker').innerHTML=pickerHtml();
  document.documentElement.style.overflow=(ui.sheet||ui.picker)?'hidden':'';
}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{t.hidden=true},3000)}

/* ---------- Training-Logik ---------- */
async function wake(on){
  try{
    if(on){if(!wake.l&&navigator.wakeLock){wake.l=await navigator.wakeLock.request('screen');wake.l.addEventListener('release',()=>{wake.l=null})}}
    else if(wake.l){await wake.l.release();wake.l=null}
  }catch(e){}
}
function startWorkout(tpl){
  const exs=tpl?tpl.exercises.map(te=>{
    const prev=lastSets(te.exId);
    const sets=[];for(let i=0;i<te.sets;i++){const p=prev?(prev[i]||prev[prev.length-1]):null;sets.push({kg:p?p.kg:'',reps:p?p.reps:te.reps,done:false})}
    return{exId:te.exId,sets:sets};
  }):[];
  state.active={id:uid(),name:tpl?tpl.name:'Freies Training',templateId:tpl?tpl.id:null,start:Date.now(),exercises:exs};
  save();wake(true);render();window.scrollTo(0,0);
  if(!exs.length)openPicker('active');
}
function newSetFor(exId){const p=lastSets(exId);const l=p&&p[p.length-1];return{kg:l?l.kg:'',reps:l?l.reps:'',done:false}}
function prsFor(done,prior){
  const out=[];
  done.forEach(e=>{
    let best=0,had=false;
    prior.forEach(w=>{const x=w.exercises.find(y=>y.exId===e.exId);if(x){had=true;x.sets.forEach(s=>{best=Math.max(best,e1(s.kg,s.reps))})}});
    const b=bestSet(e.sets);if(had&&b&&e1(b.kg,b.reps)>best+0.01)out.push({name:exById(e.exId).name,kg:b.kg,reps:b.reps,e:e1(b.kg,b.reps)});
  });
  return out;
}
function finishWorkout(){
  const a=state.active;
  const done=a.exercises.map(e=>({exId:e.exId,sets:e.sets.filter(s=>s.done&&num(s.reps)>0).map(s=>({kg:num(s.kg),reps:Math.round(num(s.reps))}))})).filter(e=>e.sets.length);
  if(!done.length){state.active=null;save();wake(false);hideRest();render();toast('Keine Sätze abgehakt, nichts gespeichert');return}
  const prs=prsFor(done,state.workouts);
  const w={id:uid(),day:ymd(a.start),start:a.start,end:Date.now(),name:(a.name||'Training').trim()||'Training',templateId:a.templateId,exercises:done};
  state.workouts.push(w);state.workouts.sort((x,y)=>x.start-y.start);
  state.active=null;save();wake(false);hideRest();
  ui.sheet={type:'summary',w:w,prs:prs};render();
}
/* Pausen-Timer */
function startRest(){ui.rest={end:Date.now()+state.rest*1000,total:state.rest};$('#restbar').hidden=false;tick()}
function hideRest(){ui.rest=null;$('#restbar').hidden=true}
function tick(){
  if(state&&state.active){const el=$('#elapsed');if(el)el.textContent=mmss((Date.now()-state.active.start)/1000)}
  if(ui.rest){
    const left=(ui.rest.end-Date.now())/1000;
    if(left<=0){try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}hideRest();toast('Pause vorbei, nächster Satz');return}
    $('#restT').textContent=mmss(left);$('#restP').style.width=(left/ui.rest.total*100)+'%';
  }
}
setInterval(tick,500);

/* ---------- Picker / Sheets öffnen ---------- */
function openPicker(target){ui.picker={target:target,q:''};renderSheets();setTimeout(()=>{const q=$('#pq');if(q)q.focus()},50)}
function addExercise(exId){
  const p=ui.picker;ui.picker=null;
  if(p.target==='active'){state.active.exercises.push({exId:exId,sets:[newSetFor(exId),newSetFor(exId),newSetFor(exId)]});save();render()}
  else if(p.target==='tpl'&&ui.sheet&&ui.sheet.type==='tpl'){ui.sheet.draft.exercises.push({exId:exId,sets:3,reps:10});renderSheets()}
}
function openTpl(id){
  const t=id&&state.templates.find(x=>x.id===id);
  ui.sheet={type:'tpl',draft:t?JSON.parse(JSON.stringify(t)):{id:null,name:'',exercises:[]}};renderSheets();
}
function openMeal(pre){
  ui.sheet={type:'meal',kcalTouched:false,draft:Object.assign({name:'',type:guessType(),p:'',c:'',f:'',kcal:''},pre||{})};renderSheets();
}
function guessType(){const h=new Date().getHours();return h<10?'Frühstück':h<15?'Mittagessen':h<18?'Snack':'Abendessen'}

/* ---------- Ereignisse ---------- */
const armed={key:null,t:0};
document.addEventListener('click',function(ev){
  const el=ev.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act;
  if(el.dataset.confirm){
    const key=act+(el.dataset.id||el.dataset.i||'');
    if(armed.key!==key){armed.key=key;el.dataset.label=el.textContent;el.textContent='Wirklich?';el.classList.add('armed');clearTimeout(armed.t);armed.t=setTimeout(()=>{armed.key=null;if(el.isConnected){el.textContent=el.dataset.label;el.classList.remove('armed')}},3000);return}
    armed.key=null;clearTimeout(armed.t);
  }
  const A=state&&state.active,i=+el.dataset.i;
  switch(act){
    case'start-tpl':startWorkout(state.templates.find(t=>t.id===el.dataset.id));break;
    case'start-free':startWorkout(null);break;
    case'new-tpl':openTpl(null);break;
    case'edit-tpl':openTpl(el.dataset.id);break;
    case'toggle-set':{
      const row=el.closest('.setrow'),ei=+el.closest('[data-ex]').dataset.ex,si=+row.dataset.set,s=A.exercises[ei].sets[si];
      if(!s.done&&!(num(s.reps)>0)){toast('Trag erst die Wiederholungen ein');return}
      s.done=!s.done;save();
      if(s.done)startRest();else hideRest();
      render();break}
    case'add-set':{const e=A.exercises[i],l=e.sets[e.sets.length-1];e.sets.push({kg:l?l.kg:'',reps:l?l.reps:'',done:false});save();render();break}
    case'rm-set':A.exercises[i].sets.pop();save();render();break;
    case'rm-ex':A.exercises.splice(i,1);save();render();break;
    case'add-ex':openPicker('active');break;
    case'finish':finishWorkout();break;
    case'cancel-workout':state.active=null;save();wake(false);hideRest();render();break;
    case'rest-add':if(ui.rest){ui.rest.end+=+el.dataset.n*1000;ui.rest.total=Math.max(15,ui.rest.total+ +el.dataset.n);state.rest=clamp(state.rest+ +el.dataset.n,15,600);save();tick()}break;
    case'rest-skip':hideRest();break;
    case'pick-ex':addExercise(el.dataset.id);render();break;
    case'pick-create':{
      const name=ui.picker.q.trim();if(!name)return;
      const ex={id:'x'+uid(),name:name,muscle:$('#newMuscle').value};state.exercises.push(ex);save();addExercise(ex.id);render();break}
    case'close-picker':ui.picker=null;renderSheets();break;
    case'close-sheet':ui.sheet=null;ui.picker=null;renderSheets();break;
    case'tpl-add-ex':openPicker('tpl');break;
    case'tpl-rm-ex':ui.sheet.draft.exercises.splice(i,1);renderSheets();break;
    case'tpl-save':{
      const d=ui.sheet.draft;
      if(!d.name.trim()){toast('Gib der Vorlage einen Namen');return}
      if(!d.exercises.length){toast('Füge mindestens eine Übung hinzu');return}
      d.name=d.name.trim();d.exercises.forEach(e=>{e.sets=clamp(Math.round(num(e.sets))||3,1,12);e.reps=clamp(Math.round(num(e.reps))||10,1,100)});
      if(d.id){const k=state.templates.findIndex(t=>t.id===d.id);state.templates[k]=d}else{d.id='t'+uid();state.templates.push(d)}
      save();ui.sheet=null;render();toast('Vorlage gespeichert');break}
    case'del-tpl':state.templates=state.templates.filter(t=>t.id!==ui.sheet.draft.id);save();ui.sheet=null;render();break;
    case'summary-tpl':{
      const w=ui.sheet.w,t={id:'t'+uid(),name:w.name,exercises:w.exercises.map(e=>({exId:e.exId,sets:e.sets.length,reps:e.sets[0].reps}))};
      state.templates.push(t);w.templateId=t.id;save();ui.sheet=null;render();toast('Vorlage „'+t.name+'“ gespeichert');break}
    case'toggle-wk':ui.open[el.dataset.id]=!ui.open[el.dataset.id];render();break;
    case'del-wk':state.workouts=state.workouts.filter(w=>w.id!==el.dataset.id);save();render();break;
    case'log-seg':ui.logView=el.dataset.v;render();break;
    case'prog-metric':ui.progMetric=el.dataset.v;render();break;
    case'rec-set':ui.recDraft[el.dataset.f]=+el.dataset.v;render();break;
    case'rec-save':{
      const d=Object.assign({},ui.recDraft,{day:today(),sleep:clamp(num(ui.recDraft.sleep),0,24),hr:num(ui.recDraft.hr)||'',kg:num(ui.recDraft.kg)||''});
      delete d.demo;state.recovery=state.recovery.filter(r=>r.day!==d.day);state.recovery.push(d);state.recovery.sort((a,b)=>a.day<b.day?-1:1);ui.recDraft=null;save();render();toast('Check-in gespeichert');break}
    case'food-prev':ui.foodDay=addDays(ui.foodDay,-1);render();break;
    case'food-next':if(ui.foodDay<today()){ui.foodDay=addDays(ui.foodDay,1);render()}break;
    case'food-add':openMeal();break;
    case'food-quick':{const m=state.meals.find(x=>x.id===el.dataset.id);if(m){state.meals.push({id:uid(),day:ui.foodDay,type:guessType(),name:m.name,kcal:m.kcal,p:m.p,c:m.c,f:m.f});save();render();toast('„'+m.name+'“ hinzugefügt')}break}
    case'food-del':state.meals=state.meals.filter(m=>m.id!==el.dataset.id);save();render();break;
    case'meal-save':{
      const d=ui.sheet.draft;if(!d.name.trim()){toast('Gib einen Namen ein');return}
      const p=num(d.p),c=num(d.c),f=num(d.f),k=num(d.kcal)||Math.round(4*p+4*c+9*f);
      if(!k){toast('Trag Kalorien oder Makros ein');return}
      state.meals.push({id:uid(),day:ui.foodDay,type:d.type,name:d.name.trim(),kcal:Math.round(k),p:Math.round(p),c:Math.round(c),f:Math.round(f)});
      save();ui.sheet=null;render();break}
    case'goals-open':ui.sheet={type:'goals',draft:Object.assign({},state.goals)};renderSheets();break;
    case'goals-save':{const d=ui.sheet.draft;state.goals={kcal:num(d.kcal)||2000,p:num(d.p),c:num(d.c),f:num(d.f)};save();ui.sheet=null;render();break}
    case'demo-remove':
      state.workouts=state.workouts.filter(w=>!w.demo);state.meals=state.meals.filter(m=>!m.demo);state.recovery=state.recovery.filter(r=>!r.demo);
      ui.recDraft=null;save();render();toast('Beispieldaten entfernt');break;
  }
});
document.addEventListener('input',function(ev){
  const t=ev.target;
  if(t.id==='pq'&&ui.picker){ui.picker.q=t.value;$('#plist').innerHTML=pickerList();return}
  if(t.dataset.a==='name'&&state.active){state.active.name=t.value;save();return}
  if(t.dataset.f&&state.active){
    const row=t.closest('.setrow');if(!row)return;
    const e=state.active.exercises[+t.closest('[data-ex]').dataset.ex],s=e.sets[+row.dataset.set];
    s[t.dataset.f]=t.value;save();
    const st=activeStats();$('#lsets').textContent=st.sets;$('#lvol').textContent=fmt(st.vol)+' kg';return}
  if(ui.sheet&&ui.sheet.draft){
    const d=ui.sheet.draft;
    if(t.dataset.di!==undefined){d.exercises[+t.dataset.di][t.dataset.df]=t.value;return}
    if(t.dataset.d){
      d[t.dataset.d]=t.value;
      if(ui.sheet.type==='meal'){
        if(t.dataset.d==='kcal')ui.sheet.kcalTouched=!!t.value;
        else if(['p','c','f'].includes(t.dataset.d)&&!ui.sheet.kcalTouched){d.kcal=String(Math.round(4*num(d.p)+4*num(d.c)+9*num(d.f))||'');const k=$('#mkcal');if(k)k.value=d.kcal}
      }
      if(ui.sheet.type==='goals'){const g=$('#goalcal');if(g)g.textContent='Die Makros ergeben '+fmt(4*num(d.p)+4*num(d.c)+9*num(d.f))+' kcal.'}
    }
  }
});
document.addEventListener('change',function(ev){
  const t=ev.target,k=t.dataset.actChange;
  if(t.dataset.d&&ui.sheet&&ui.sheet.draft&&t.tagName==='SELECT'){ui.sheet.draft[t.dataset.d]=t.value;return}
  if(!k)return;
  if(k==='cmpA'){ui.cmpA=t.value;render()}
  else if(k==='cmpB'){ui.cmpB=t.value;render()}
  else if(k==='progEx'){ui.progEx=t.value;render()}
  else if(k==='rec-sleep'){ui.recDraft.sleep=num(t.value);render()}
  else if(k==='rec-hr'){ui.recDraft.hr=t.value}
  else if(k==='rec-kg'){ui.recDraft.kg=t.value}
});
function route(){
  const h=(location.hash||'').replace('#','');
  const t=TABS.find(x=>x[0]===h);ui.tab=t?t[0]:'train';
  if(ui.tab!=='recovery')ui.recDraft=ui.recDraft;
  render();window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state&&state.active)wake(true);tick()});

/* ---------- Start ---------- */
(async function init(){
  setSync('local');
  await loadAll();
  ui.loading=false;
  if(state.active)wake(true);
  route();
})();
})();
</script>
</body>
</html>
