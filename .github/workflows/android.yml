name: Android APK bauen

on:
  push:
    branches: [main, master, 'claude/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gym-tracker-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Version lesen
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      # Der Signaturschlüssel liegt als Secret ANDROID_KEYSTORE_BASE64 im Repository
      # (Settings → Secrets and variables → Actions). Mit immer demselben Schlüssel
      # lässt sich jede neue APK über die alte installieren, ohne Datenverlust.
      - name: Signaturschlüssel einrichten
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          IS_RELEASE: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Signaturschlüssel aus dem Secret übernommen."
          elif [ "$IS_RELEASE" = "true" ]; then
            echo "::error::Das Secret ANDROID_KEYSTORE_BASE64 fehlt. Ohne festen Schlüssel ließe sich die neue APK nicht über die alte installieren. Lege das Secret an (siehe README) und starte den Bau neu."
            exit 1
          else
            echo "::warning::Kein Secret ANDROID_KEYSTORE_BASE64. Dieser Testbau bekommt einen zufälligen Schlüssel und lässt sich nicht über die installierte App installieren."
          fi

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Android-Projekt erzeugen und anpassen
        run: bash scripts/prepare-android.sh

      - name: APK bauen
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/gym-tracker-v$VERSION.apk"

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: gym-tracker-v${{ env.VERSION }}
          path: gym-tracker-v${{ env.VERSION }}.apk

      # Auf main entsteht für jede neue Versionsnummer automatisch ein GitHub-Release mit der APK.
      - name: Release veröffentlichen
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG gibt es schon. Für ein neues Release die Version in gym-tracker-app/package.json erhöhen."
            exit 0
          fi
          gh release create "$TAG" "$GITHUB_WORKSPACE/gym-tracker-v$VERSION.apk" \
            --target "$GITHUB_SHA" \
            --title "Gym Tracker $VERSION" \
            --notes "APK herunterladen und über die installierte App installieren. Die Daten bleiben erhalten."
