name: Android APK bauen

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ZIP-Datei entpacken
        run: |
          ZIP=$(ls -1 *.zip 2>/dev/null | head -1)
          if [ -z "$ZIP" ]; then
            echo "Keine ZIP-Datei im Repository gefunden. Lade gym-tracker-app.zip in den Hauptordner hoch."
            exit 1
          fi
          echo "Verwende $ZIP"
          mkdir -p _build
          unzip -q -o "$ZIP" -d _build
          CONFIG=$(find _build -name capacitor.config.json -not -path "*/node_modules/*" | head -1)
          if [ -z "$CONFIG" ]; then
            echo "In der ZIP-Datei fehlt capacitor.config.json."
            exit 1
          fi
          echo "APP_DIR=$(dirname "$CONFIG")" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Abhängigkeiten installieren
        run: cd "$APP_DIR" && npm install

      - name: Android-Projekt erzeugen
        run: cd "$APP_DIR" && npx cap add android

      - name: Web-App kopieren
        run: cd "$APP_DIR" && npx cap sync android

      - name: Debug-APK bauen
        run: |
          cd "$APP_DIR/android"
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/gym-tracker.apk"

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: gym-tracker-debug-apk
          path: gym-tracker.apk
